<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claimsys | Secure Quantum Infrastructure</title>
    <style>
        :root {
            --primary-green: #2ecc71;
            --secondary-blue: #1b3a6b;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            scroll-behavior: smooth;
        }
        
        body { 
            background-color: var(--dark-bg); 
            color: var(--text-light); 
            line-height: 1.6; 
        }
        
        header { 
            padding: 1.5rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #1e293b; 
            position: sticky;
            top: 0;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
        }
        
        .logo-container { 
            display: flex; 
            align-items: center; 
            gap: 1.2rem; 
        }
        
        .logo-emblem { 
            width: 50px; 
            height: 50px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            filter: drop-shadow(0 4px 12px rgba(46, 204, 113, 0.2)); 
        }
        
        .logo-text h1 { 
            font-size: 1.6rem; 
            font-weight: 800; 
            letter-spacing: 1.5px; 
            background: linear-gradient(to right, #ffffff, #cbd5e1); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        
        .logo-text p { 
            font-size: 0.68rem; 
            text-transform: uppercase; 
            letter-spacing: 2.5px; 
            color: var(--primary-green); 
            font-weight: 600; 
            margin-top: -2px; 
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 550;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--primary-green);
        }
        
        .hero { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 8rem 2rem 5rem 2rem; 
            text-align: center; 
        }
        
        .hero h2 { 
            font-size: 3.2rem; 
            font-weight: 800; 
            margin-bottom: 1.5rem; 
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        
        .hero p { 
            font-size: 1.2rem; 
            color: var(--text-muted); 
            max-width: 800px; 
            margin: 0 auto 2rem auto; 
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 3rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background-color: var(--primary-green);
            margin: 0.8rem auto 0 auto;
            border-radius: 2px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 5rem 2rem;
        }

        .grid-features { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 2rem; 
        }
        
        .card { 
            background-color: var(--card-bg); 
            padding: 2.5rem; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; 
        }
        
        .card:hover { 
            transform: translateY(-5px); 
            border-color: var(--primary-green); 
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.05);
        }
        
        .card h3 { 
            font-size: 1.3rem; 
            margin-bottom: 1rem; 
            color: #ffffff; 
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card h3 span {
            color: var(--primary-green);
            font-family: monospace;
            font-size: 1.1rem;
        }
        
        .card p { 
            color: var(--text-muted); 
            font-size: 0.95rem; 
        }

        /* Nueva sección de arquitectura física y diseño modular */
        .architecture-layout {
            display: flex;
            flex-direction: column;
            gap: 4rem;
        }

        .arch-block {
            display: flex;
            gap: 3rem;
            align-items: center;
            background-color: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(51, 65, 85, 0.5);
            padding: 3rem;
            border-radius: 24px;
        }

        .arch-block:nth-child(even) {
            flex-direction: row-reverse;
        }

        .arch-info {
            flex: 1;
        }

        .arch-info h4 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        .arch-info ul {
            list-style: none;
            margin-top: 1rem;
        }

        .arch-info ul li {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            padding-left: 1.2rem;
            position: relative;
        }

        .arch-info ul li::before {
            content: "•";
            color: var(--primary-green);
            position: absolute;
            left: 0;
            font-size: 1.2rem;
            top: -2px;
        }

        /* Nueva sección institucional corporativa */
        .governance-banner {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3.5rem;
            text-align: center;
        }

        .gov-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2.5rem;
            text-align: left;
        }

        .gov-item {
            border-left: 2px solid var(--primary-green);
            padding-left: 1.5rem;
        }

        .gov-item h5 {
            color: #ffffff;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        
        .contact-section { 
            max-width: 700px; 
            margin: 4rem auto; 
            padding: 4rem 2rem; 
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); 
            border-radius: 24px; 
            border: 1px solid var(--border-color); 
            text-align: center; 
        }
        
        .contact-section h3 { 
            font-size: 2rem; 
            margin-bottom: 1rem; 
        }
        
        .contact-section p { 
            color: var(--text-muted); 
            margin-bottom: 2.5rem; 
            font-size: 1.05rem;
        }
        
        .btn-contact { 
            display: inline-block; 
            padding: 1.1rem 3rem; 
            background: linear-gradient(135deg, var(--primary-green) 0%, #27ae60 100%); 
            color: #ffffff; 
            text-decoration: none; 
            font-weight: 600; 
            border-radius: 30px; 
            box-shadow: 0 4px 20px rgba(46, 204, 113, 0.25); 
            transition: transform 0.2s ease, box-shadow 0.2s ease; 
        }
        
        .btn-contact:hover { 
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(46, 204, 113, 0.35);
        }
        
        footer { 
            text-align: center; 
            padding: 4rem 2rem; 
            color: #475569; 
            font-size: 0.85rem; 
            border-top: 1px solid #1e293b; 
            margin-top: 4rem; 
        }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1.5rem; text-align: center; }
            nav ul { gap: 1rem; }
            .hero h2 { font-size: 2.2rem; }
            .arch-block, .arch-block:nth-child(even) { flex-direction: column; padding: 2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-emblem">
                <svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://w3.org">
                    <defs>
                        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2ecc71" />
                            <stop offset="60%" stop-color="#1abc9c" />
                            <stop offset="100%" stop-color="#1b3a6b" />
                        </linearGradient>
                        <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#27ae60" />
                            <stop offset="100%" stop-color="#2ecc71" />
                        </linearGradient>
                    </defs>
                    <path d="M50,5 C50,5 88,12 88,45 C88,72 50,95 50,95 C50,95 12,72 12,45 C12,12 50,5 50,5 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="4" stroke-linejoin="round"/>
